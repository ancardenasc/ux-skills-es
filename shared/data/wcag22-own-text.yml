# Textos propios (redacción mía, no traducción ni paráfrasis en masa de WCAG) para los criterios A y AA.
# Fuente de los hechos (id, nombre, nivel, versión): W3C, ver scripts/gen_wcag_data.py.
# label_es: etiqueta corta propia, NO es la traducción oficial. es/en: resumen de máx. 25 palabras.
# code | url | design: qué tanto se puede evaluar en cada modo de entrada: yes | partial | no.
"1.1.1": { label_es: Contenido no textual, es: "Imágenes, iconos y controles sin texto necesitan una alternativa textual equivalente; lo decorativo debe ignorarse para las tecnologías de apoyo.", en: "Images, icons and non-text controls need an equivalent text alternative; purely decorative content should be ignored by assistive technology.", code: partial, url: partial, design: partial }
"1.2.1": { label_es: Solo audio o solo video grabado, es: "Los medios grabados solo de audio o solo de video ofrecen una alternativa, como transcripción o descripción, que transmita lo mismo.", en: "Prerecorded audio-only or video-only media provides an alternative, such as a transcript or description, conveying the same information.", code: partial, url: partial, design: "no" }
"1.2.2": { label_es: Subtítulos de video grabado, es: "El video grabado con audio incluye subtítulos sincronizados que reflejan los diálogos y los sonidos relevantes.", en: "Prerecorded video with audio includes synchronized captions covering dialogue and meaningful sounds.", code: partial, url: partial, design: "no" }
"1.2.3": { label_es: Audiodescripción o alternativa, es: "El video grabado ofrece una descripción de lo que ocurre en pantalla o una alternativa textual completa.", en: "Prerecorded video offers a description of what happens on screen, or a full text alternative.", code: partial, url: partial, design: "no" }
"1.2.4": { label_es: Subtítulos en vivo, es: "Las transmisiones en vivo con audio ofrecen subtítulos en tiempo real.", en: "Live audio content provides real-time captions.", code: "no", url: partial, design: "no" }
"1.2.5": { label_es: Audiodescripción grabada, es: "El video grabado incluye audiodescripción de la información visual que la banda sonora no cubre.", en: "Prerecorded video includes audio description for visual information the soundtrack does not cover.", code: partial, url: partial, design: "no" }
"1.3.1": { label_es: Información y relaciones, es: "La estructura y las relaciones que se ven (títulos, listas, tablas, etiquetas) también están en el marcado, no solo en el estilo visual.", en: "Structure and relationships shown visually (headings, lists, tables, labels) are also conveyed in markup, not by styling alone.", code: "yes", url: "yes", design: partial }
"1.3.2": { label_es: Secuencia con sentido, es: "El orden del contenido en el código conserva el sentido cuando se lee de forma secuencial.", en: "The reading order in the code preserves meaning when content is read sequentially.", code: partial, url: partial, design: "no" }
"1.3.3": { label_es: Características sensoriales, es: "Las instrucciones no dependen solo de forma, color, tamaño, ubicación o sonido para identificar un elemento.", en: "Instructions do not rely only on shape, color, size, location or sound to identify an element.", code: "no", url: partial, design: partial }
"1.3.4": { label_es: Orientación, es: "El contenido funciona en vertical y en horizontal, salvo que una orientación sea esencial.", en: "Content works in both portrait and landscape unless one orientation is essential.", code: partial, url: "yes", design: partial }
"1.3.5": { label_es: Propósito de los campos, es: "Los campos que piden datos personales declaran su propósito, por ejemplo con autocomplete, para poder autocompletarse.", en: "Fields collecting personal data declare their purpose, for example with autocomplete, so they can be filled automatically.", code: "yes", url: "yes", design: "no" }
"1.4.1": { label_es: Uso del color, es: "El color no es la única forma de transmitir información, indicar una acción o distinguir elementos.", en: "Color is not the only way to convey information, indicate an action or distinguish elements.", code: partial, url: partial, design: partial }
"1.4.2": { label_es: Control del audio, es: "El audio que suena más de tres segundos se puede pausar, detener o bajar de volumen.", en: "Audio that plays for more than three seconds can be paused, stopped or have its volume controlled.", code: partial, url: partial, design: "no" }
"1.4.3": { label_es: Contraste mínimo del texto, es: "El texto contrasta con su fondo al menos 4.5:1, o 3:1 si es grande.", en: "Text contrasts with its background at least 4.5:1, or 3:1 for large text.", code: partial, url: "yes", design: partial }
"1.4.4": { label_es: Cambio de tamaño del texto, es: "El texto se puede ampliar hasta 200 % sin perder contenido ni funciones.", en: "Text can be enlarged to 200% without losing content or functionality.", code: partial, url: "yes", design: "no" }
"1.4.5": { label_es: Imágenes de texto, es: "Se usa texto real en lugar de imágenes de texto, salvo logotipos o casos esenciales.", en: "Real text is used instead of images of text, except for logos or essential cases.", code: partial, url: partial, design: partial }
"1.4.10": { label_es: Reflujo, es: "El contenido se adapta a 320 píxeles de ancho sin scroll horizontal ni pérdida de información.", en: "Content reflows at 320 CSS pixels wide without horizontal scrolling or loss of information.", code: partial, url: "yes", design: "no" }
"1.4.11": { label_es: Contraste de elementos no textuales, es: "Los componentes de interfaz y los gráficos informativos contrastan al menos 3:1 con los colores contiguos.", en: "UI components and informative graphics have at least 3:1 contrast against adjacent colors.", code: partial, url: "yes", design: partial }
"1.4.12": { label_es: Espaciado del texto, es: "Aumentar interlineado y espaciado del texto no provoca pérdida de contenido ni de funciones.", en: "Increasing line, paragraph, letter and word spacing causes no loss of content or functionality.", code: partial, url: "yes", design: "no" }
"1.4.13": { label_es: Contenido al pasar el cursor o enfocar, es: "El contenido que aparece al pasar el cursor o enfocar se puede descartar, se mantiene visible y el puntero puede recorrerlo.", en: "Content shown on hover or focus can be dismissed, stays visible while needed, and the pointer can move over it.", code: partial, url: "yes", design: "no" }
"2.1.1": { label_es: Teclado, es: "Toda la funcionalidad se puede usar solo con el teclado.", en: "All functionality is operable with a keyboard alone.", code: partial, url: "yes", design: "no" }
"2.1.2": { label_es: Sin trampas de teclado, es: "El foco del teclado puede salir de cualquier componente usando el mismo teclado.", en: "Keyboard focus can always leave a component using the keyboard.", code: partial, url: "yes", design: "no" }
"2.1.4": { label_es: Atajos de una tecla, es: "Los atajos de una sola tecla se pueden desactivar, reasignar o solo actúan con el foco en el componente.", en: "Single-character shortcuts can be turned off, remapped, or only work when the component has focus.", code: partial, url: partial, design: "no" }
"2.2.1": { label_es: Tiempo ajustable, es: "Los límites de tiempo se pueden desactivar, ajustar o extender, salvo los esenciales.", en: "Time limits can be turned off, adjusted or extended, unless essential.", code: partial, url: partial, design: "no" }
"2.2.2": { label_es: Pausar, detener, ocultar, es: "El contenido que se mueve, parpadea o se actualiza solo se puede pausar, detener u ocultar.", en: "Moving, blinking or auto-updating content can be paused, stopped or hidden.", code: partial, url: "yes", design: "no" }
"2.3.1": { label_es: Tres destellos, es: "Nada destella más de tres veces por segundo, salvo por debajo de los umbrales de destello.", en: "Nothing flashes more than three times per second unless below the flash thresholds.", code: "no", url: partial, design: "no" }
"2.4.1": { label_es: Saltar bloques, es: "Hay un mecanismo para saltar bloques repetidos, como un enlace de salto o puntos de referencia.", en: "A mechanism lets users skip repeated blocks, such as a skip link or landmarks.", code: "yes", url: "yes", design: "no" }
"2.4.2": { label_es: Título de la página, es: "Cada página tiene un título que describe su tema o propósito.", en: "Each page has a title describing its topic or purpose.", code: "yes", url: "yes", design: "no" }
"2.4.3": { label_es: Orden del foco, es: "El orden del foco con teclado conserva el sentido y la operabilidad.", en: "Keyboard focus order preserves meaning and operability.", code: partial, url: "yes", design: partial }
"2.4.4": { label_es: Propósito del enlace, es: "El propósito de cada enlace se entiende por su texto o por su contexto inmediato.", en: "The purpose of each link can be understood from its text or its immediate context.", code: "yes", url: "yes", design: partial }
"2.4.5": { label_es: Varias vías, es: "Hay más de una forma de llegar a una página dentro de un conjunto, salvo en pasos de un proceso.", en: "More than one way exists to reach a page within a set, except process steps.", code: partial, url: partial, design: "no" }
"2.4.6": { label_es: Títulos y etiquetas, es: "Los títulos y las etiquetas describen el tema o la finalidad del contenido.", en: "Headings and labels describe the topic or purpose of the content.", code: partial, url: partial, design: partial }
"2.4.7": { label_es: Foco visible, es: "El elemento con foco de teclado tiene un indicador visible.", en: "The keyboard-focused element has a visible focus indicator.", code: partial, url: "yes", design: partial }
"2.4.11": { label_es: Foco no oculto, es: "El elemento enfocado no queda totalmente tapado por contenido fijo como cabeceras, banners o diálogos.", en: "A focused element is not entirely hidden by author-created content such as sticky headers, banners or dialogs.", code: "no", url: "yes", design: "no" }
"2.5.1": { label_es: Gestos con el puntero, es: "Los gestos de varios puntos o de trayectoria tienen una alternativa con un solo puntero.", en: "Multipoint or path-based gestures have a single-pointer alternative.", code: partial, url: partial, design: "no" }
"2.5.2": { label_es: Cancelación del puntero, es: "Las acciones con puntero se pueden cancelar, por ejemplo ejecutándose al soltar y no al presionar.", en: "Pointer actions can be cancelled, for example by triggering on release rather than on press.", code: partial, url: partial, design: "no" }
"2.5.3": { label_es: Etiqueta en el nombre, es: "El nombre accesible de un control contiene el texto visible de su etiqueta.", en: "A control's accessible name contains its visible label text.", code: "yes", url: "yes", design: "no" }
"2.5.4": { label_es: Activación por movimiento, es: "Las funciones activadas por el movimiento del dispositivo también se pueden usar desde la interfaz y desactivarse.", en: "Functions triggered by device motion can also be used through the interface and can be disabled.", code: partial, url: partial, design: "no" }
"2.5.7": { label_es: Movimientos de arrastre, es: "Toda acción de arrastrar tiene una alternativa con un solo puntero que no requiera arrastrar.", en: "Any dragging action has a single-pointer alternative that does not require dragging.", code: partial, url: partial, design: partial }
"2.5.8": { label_es: Tamaño del objetivo, es: "Los objetivos del puntero miden al menos 24 por 24 píxeles CSS o tienen suficiente espacio a su alrededor.", en: "Pointer targets are at least 24 by 24 CSS pixels, or have sufficient surrounding spacing.", code: partial, url: "yes", design: "yes" }
"3.1.1": { label_es: Idioma de la página, es: "El idioma principal de la página está declarado en el código.", en: "The main language of the page is declared in the code.", code: "yes", url: "yes", design: "no" }
"3.1.2": { label_es: Idioma de las partes, es: "Los pasajes en otro idioma se marcan con su idioma, salvo nombres propios y términos técnicos.", en: "Passages in another language are marked with their language, except proper names and technical terms.", code: partial, url: partial, design: "no" }
"3.2.1": { label_es: Al recibir el foco, es: "Recibir el foco no provoca por sí solo un cambio de contexto.", en: "Receiving focus does not by itself trigger a change of context.", code: partial, url: "yes", design: "no" }
"3.2.2": { label_es: Al introducir datos, es: "Cambiar el valor de un control no provoca un cambio de contexto sin avisar antes.", en: "Changing a control's value does not cause a change of context without prior warning.", code: partial, url: "yes", design: "no" }
"3.2.3": { label_es: Navegación coherente, es: "La navegación repetida aparece en el mismo orden relativo en todas las páginas.", en: "Repeated navigation appears in the same relative order across pages.", code: "no", url: partial, design: partial }
"3.2.4": { label_es: Identificación coherente, es: "Los componentes con la misma función se identifican de forma coherente en todo el sitio.", en: "Components with the same function are identified consistently throughout.", code: "no", url: partial, design: partial }
"3.2.6": { label_es: Ayuda coherente, es: "Si hay ayuda o contacto, aparece en el mismo lugar relativo en las páginas donde se ofrece.", en: "Where help or contact options are offered, they appear in the same relative place on each page.", code: "no", url: partial, design: partial }
"3.3.1": { label_es: Identificación de errores, es: "Los errores de entrada se detectan automáticamente y se describen al usuario en texto.", en: "Input errors are automatically detected and described to the user in text.", code: partial, url: "yes", design: partial }
"3.3.2": { label_es: Etiquetas o instrucciones, es: "Los campos tienen etiquetas o instrucciones visibles cuando se pide una entrada al usuario.", en: "Visible labels or instructions are provided when user input is required.", code: "yes", url: "yes", design: partial }
"3.3.3": { label_es: Sugerencia ante errores, es: "Si se conoce la corrección de un error, se sugiere al usuario, salvo que comprometa la seguridad.", en: "When a correction for an error is known, it is suggested to the user, unless it endangers security.", code: "no", url: partial, design: partial }
"3.3.4": { label_es: Prevención de errores graves, es: "Los envíos legales, financieros o de datos se pueden revisar, corregir o revertir.", en: "Legal, financial or data submissions are reversible, checked or confirmable.", code: "no", url: partial, design: partial }
"3.3.7": { label_es: Entrada redundante, es: "No se vuelve a pedir información ya dada en el mismo proceso, salvo que sea esencial.", en: "Information already provided in the same process is not requested again, unless essential.", code: "no", url: partial, design: partial }
"3.3.8": { label_es: Autenticación accesible, es: "Autenticarse no exige una prueba cognitiva, como recordar o transcribir, salvo que haya alternativas o ayudas.", en: "Authentication does not require a cognitive function test, such as remembering or transcribing, unless alternatives or aids exist.", code: partial, url: partial, design: "no" }
"4.1.2": { label_es: Nombre, función y valor, es: "Todo componente expone nombre, rol y valor a las tecnologías de apoyo, y notifica sus cambios.", en: "Every component exposes name, role and value to assistive technology, and changes are notified.", code: partial, url: "yes", design: "no" }
"4.1.3": { label_es: Mensajes de estado, es: "Los mensajes de estado se anuncian a las tecnologías de apoyo sin mover el foco.", en: "Status messages are announced to assistive technology without moving focus.", code: partial, url: partial, design: "no" }
