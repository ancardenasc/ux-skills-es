# Fuente única del catálogo. El marketplace, los manifiestos de plugin y las tablas
# del README se generan desde este archivo (scripts/build.py, scripts/gen_readme.py).
repo: ancardenasc/ux-skills-es
license: MIT
author: { name: Nicolas Cardenas, url: https://github.com/ancardenasc }
marketplace:
  name: ux-skills-es
  description: Skills de UX y accesibilidad en español, instalables por separado para Claude Code y GitHub Copilot.

# Un plugin por skill. La versión vive solo aquí (se escribe en el manifiesto del plugin).
plugins:
  wcag22-audit:
    version: 0.1.0
    description: Audita accesibilidad web contra WCAG 2.2 A y AA desde código, URL o diseño, con informe en español, evidencia y brechas honestas.

  heuristic-review-es:
    version: 0.1.0
    description: Revisión heurística de usabilidad en español con las 10 heurísticas de Nielsen, con evidencia, verificación manual y brechas honestas.

# type: skill. id = nombre de carpeta en src/skills/.
# vendor: archivos de shared/ que se copian dentro de cada skill (references/_shared/) para que
# el skill sea autocontenido. {lang} se expande con langs.
assets:
  - id: wcag22-audit
    type: skill
    plugin: wcag22-audit
    description: Audita accesibilidad web contra WCAG 2.2 A y AA desde código, URL o diseño; informe en español con evidencia, prueba manual y brechas honestas.
    description_en: Audits web accessibility against WCAG 2.2 A and AA from code, a URL or a design; Spanish-first report with evidence, manual checks and honest gaps.
    vendor:
      - { src: schema/report.schema.json }
      - { src: "references/report-format.{lang}.md", langs: [es, en] }
      - { src: "references/severity-and-confidence.{lang}.md", langs: [es, en] }
      - { src: "references/input-modes.{lang}.md", langs: [es, en] }
      - { src: "references/honest-gaps.{lang}.md", langs: [es, en] }
      - { src: references/legal-copyright-rules.md }
      - { src: data/wcag22-criteria.json }
      - { src: "templates/report.{lang}.md", langs: [es, en] }
      - { src: i18n/labels.yml }
  - id: heuristic-review-es
    type: skill
    plugin: heuristic-review-es
    description: Revisión heurística de usabilidad con las 10 heurísticas de Nielsen desde código, URL o diseño; informe en español con evidencia y brechas honestas.
    description_en: Usability heuristic review with Nielsen's 10 heuristics from code, a URL or a design; Spanish-first report with evidence and honest gaps.
    vendor:
      - { src: schema/report.schema.json }
      - { src: "references/report-format.{lang}.md", langs: [es, en] }
      - { src: "references/severity-and-confidence.{lang}.md", langs: [es, en] }
      - { src: "references/input-modes.{lang}.md", langs: [es, en] }
      - { src: "references/honest-gaps.{lang}.md", langs: [es, en] }
      - { src: references/legal-copyright-rules.md }
      - { src: data/nielsen-heuristics.json }
      - { src: "templates/report.{lang}.md", langs: [es, en] }
      - { src: i18n/labels.yml }
