<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Café Aurora – Inicio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#contenido">Saltar al contenido</a>
  <header>
    <img src="logo.svg" alt="Café Aurora">
    <nav aria-label="Principal">
      <a href="#menu">Menú</a> <a href="#visitanos">Visítanos</a>
    </nav>
  </header>
  <main id="contenido">
    <img class="banner" src="banner.jpg">
    <h1>Café de origen, tostado cada mañana</h1>
    <p class="nota">Pedidos con un día de anticipación para eventos.</p>
    <form action="/suscribirse" method="post">
      <input type="email" name="correo" placeholder="Tu correo">
      <label for="nombre">Nombre</label>
      <input id="nombre" type="text" name="nombre" autocomplete="name">
      <div class="btn" onclick="enviar()">Suscribirme</div>
    </form>
    <button class="icono" aria-label="Cerrar aviso"><img src="x.svg" alt=""></button>
  </main>
</body>
</html>
